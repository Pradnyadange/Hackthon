version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: edumatrix_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: edumatrix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: edumatrix_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/edumatrix?schema=public"
      JWT_SECRET: "edumatrix_super_secret_jwt_key_2026_safe"
      JWT_REFRESH_SECRET: "edumatrix_super_secret_refresh_jwt_key_2026_safe"
      PORT: 5000
    depends_on:
      - postgres

volumes:
  postgres_data:
